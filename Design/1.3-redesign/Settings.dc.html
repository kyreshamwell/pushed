<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#3FD26A}a:hover{color:#6BE38C}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #000000; color: #F5F5F7; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 22px">
  <div style="height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 8px">
    <a href="Home.dc.html" style="display: flex; align-items: center; gap: 2px; text-decoration: none; font-size: 17px; height: 44px; padding: 0 8px">
      <svg width="12" height="20" viewBox="0 0 12 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2L2 10l8 8"></path></svg>
      <span>Home</span>
    </a>
    <span style="font-size: 17px; font-weight: 600">Settings</span>
    <span style="width: 76px"></span>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <span style="font-size: 13px; color: #8E8E93; padding-left: 16px; text-transform: uppercase; letter-spacing: 0.04em">Streak</span>
    <div style="background: #1C1C1E; border-radius: 14px; overflow: hidden">
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2C2C2E"><span style="font-size: 16px">Rest days</span><span style="font-size: 16px; color: #8E8E93">Sat, Sun</span></div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2C2C2E"><span style="font-size: 16px">Freezes</span><span style="font-size: 16px; color: #8E8E93">1 left</span></div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2C2C2E"><span style="font-size: 16px">Streak icon</span><span style="font-size: 16px; color: #8E8E93">Flame</span></div>
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px"><span style="font-size: 16px">Day off mark</span><span style="font-size: 16px; color: #8E8E93">Stripes</span></div>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <span style="font-size: 13px; color: #8E8E93; padding-left: 16px; text-transform: uppercase; letter-spacing: 0.04em">Reminders</span>
    <div style="background: #1C1C1E; border-radius: 14px; overflow: hidden">
      <sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
        <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid {{t.line}}">
          <span style="font-size: 16px">{{t.label}}</span>
          <button type="button" onClick="{{t.flip}}" aria-pressed="{{t.on}}" aria-label="{{t.label}}" style="width: 51px; height: 31px; border-radius: 16px; border: 0; padding: 0; position: relative; background: {{t.bg}}; cursor: pointer; transition: background .2s ease">
            <span style="position: absolute; top: 2px; left: {{t.knob}}px; width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.3); transition: left .22s cubic-bezier(.2,.8,.2,1)"></span>
          </button>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px; padding: 0 16px">
    <span style="font-size: 13px; color: #8E8E93; padding-left: 16px; text-transform: uppercase; letter-spacing: 0.04em">GitHub</span>
    <div style="background: #1C1C1E; border-radius: 14px; overflow: hidden">
      <div style="height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #2C2C2E"><span style="font-size: 16px">Account</span><span style="font-size: 16px; color: #8E8E93">Connected</span></div>
      <div style="height: 48px; display: flex; align-items: center; padding: 0 16px"><span style="font-size: 16px; color: #3FD26A">Refresh now</span></div>
    </div>
  </div>

  <div style="flex: 1"></div>
  <span style="text-align: center; font-size: 12px; color: #8E8E93; padding-bottom: 24px">Pushed 1.3</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { daily: true, milestones: true, token: true };
  }
  renderVals() {
    const s = this.state;
    const rows = [['daily', 'Daily reminder'], ['milestones', 'Streak milestones'], ['token', 'Token expiry']];
    return {
      toggles: rows.map(([k, label], i) => ({
        label, on: s[k],
        bg: s[k] ? '#3FD26A' : '#39393D',
        knob: s[k] ? 22 : 2,
        line: i < rows.length - 1 ? '#2C2C2E' : 'transparent',
        flip: () => this.setState({ [k]: !s[k] })
      }))
    };
  }
}
</script>
</body>
</html>
