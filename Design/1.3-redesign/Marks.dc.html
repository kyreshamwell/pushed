<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Marks look</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=JetBrains+Mono:wght@500;700&amp;family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1120px; height: 760px; box-sizing: border-box; padding: 64px; background: #0B0B0C; color: #F5F5F7; font-family: Inter, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; gap: 32px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 44px; font-weight: 800; letter-spacing: -0.03em">Marks, a new template</h1>
    <p style="margin: 0; font-size: 17px; color: #A1A1A6; line-height: 1.5; max-width: 820px">One solid color, no glow. Every day gets a symbol, so the widget tells you what happened, not just how much. Pick any color in Customize and the whole thing follows it.</p>
  </div>
  <div style="display: flex; gap: 40px; align-items: flex-start">
    <dc-import name="Widget" look="marks" family="small" hint-size="170px,170px"></dc-import>
    <dc-import name="Widget" look="marks" family="medium" hint-size="364px,170px"></dc-import>
    <dc-import name="Widget" look="marks" family="large" hint-size="364px,382px"></dc-import>
  </div>
  <div style="display: flex; gap: 36px; font-size: 15px; color: #D1D1D6">
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 4px; background: #1C1C1E; display: flex; align-items: center; justify-content: center"><span style="width: 10px; height: 10px; border-radius: 5px; background: #F2F2F2"></span></span><span>Pushed (brighter = busier)</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 4px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; color: #8E8E93; font-size: 18px; font-weight: 700">×</span><span>Missed</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 4px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; color: #AEAEB2; font-size: 14px; font-weight: 700">F</span><span>Freeze used</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 4px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; color: #8E8E93; font-size: 14px; font-weight: 700">R</span><span>Rest day</span></div>
    <div style="display: flex; align-items: center; gap: 10px"><span style="width: 22px; height: 22px; border-radius: 4px; background: #1C1C1E; outline: 1.5px solid #F2F2F2; outline-offset: 1.5px"></span><span>Today</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1120,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
